<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>havcs设备管理平台</title>
    <meta deviceName="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <link rel="stylesheet" href="/havcs/css/weui.min.css"/>
    <link rel="stylesheet" href="/havcs/css/weuix.css"/>
    <link rel="stylesheet" href="/havcs/css/jquery-weui.min.css"/>
    <link rel="stylesheet" href="/havcs/css/materialdesignicons.min.css" type="text/css"/>
    <link rel="stylesheet" href="/havcs/css/highlight.default.css">
    <link rel="shortcut icon" href="/havcs/images/favicon.ico" type="image/x-icon"/>
    <script src="/havcs/js/vue.min.js"></script>
    <script src="/havcs/js/vue-resource.min.js"></script>
    <script src="/havcs/js/vue-router.min.js"></script>
    <script src="/havcs/js/ha.js"></script>
    <script>
    // HA的iframe权限策略禁止注册unload事件（控制台Violation告警）：
    // 在jQuery加载前包装addEventListener，将unload注册自动转为pagehide（Chrome推荐替代）
    (function() {
        var win = window;
        var _add = win.addEventListener ? win.addEventListener.bind(win) : null;
        if (_add) {
            win.addEventListener = function(type, listener, options) {
                return _add(type === 'unload' ? 'pagehide' : type, listener, options);
            };
        }
    })();
    </script>
    <script src="/havcs/js/jquery.min.js"></script>
    <script src="/havcs/js/jquery-weui.min.js"></script>
	<script src="/havcs/js/highlight.pack.js"></script>
    <style>
        .page-hd-title {
            text-align: center;
            font-size: 20px;
            color: #3cc51f;
            font-weight: 400;
            margin: 0 15%;
        }
        .blank {
            height: 2.0em;
            display:block;
        }
        .weui-label {
    		display: block;
            /* width: 260px; */
            margin-right: 10px;
    		word-wrap: break-word;
    		word-break: break-all;
        }
        .weui-label div:first-child {
            text-align: center;
            margin: 0 auto;
            font-size: 1em;
        }
        .required::after {
            content: '* ';
            color: red;
        }
        .weui-label div:nth-child(2) {
            text-align: center;
            margin: 0 auto;
            font-size: 0.5em;
        }
        .weui-grid__icon {
            width: 64px;
            height: 64px;
            text-align: center;
            margin: 0 auto;
        }
        li a {
            color: #ec6f6f;
        }
        .input_disabled {
            /* color: #998f8f; */
            
            border: 1px solid #DDD;
            background-color: #F5F5F5;
            color:#ACA899;
        }
        .tooltip label:hover,a:hover{
            cursor:pointer;
        }
   
        /* Tooltip 容器 */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        
        /* Tooltip 文本 */
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 80px;
            background-color: rgb(241, 147, 5);
            color: #fff;
            text-align: center;
            padding: 5px 0;
            border-radius: 6px;
            font-size: 10px;
            /* 定位 */
            position: absolute;
            z-index: 1;
        }
        
        /* 鼠标移动上去后显示提示框 */
        .tooltip:hover .tooltiptext {
            visibility: visible;
        }

        .tooltip .tooltiptext {
            top: 5px;
            right: 115%; 
        }

        .tooltip .tooltiptext::after {
            content: " ";
            position: absolute;
            top: 50%;
            left: 100%; /* 提示工具右侧 */
            margin-top: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent transparent rgb(241, 147, 5);
        }

        .tooltip .tooltiptext {
            opacity: 0;
            transition: opacity 1s;
        }
        
        .tooltip:hover .tooltiptext {
            opacity: 1;
        }

        #wrapper {
            text-align: center;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
        }
        #toolbar {
            max-width: 500px;
            min-width: 350px;
            margin: 10px auto;
        }
        #toolbar .toolbar__tip {
            display: none;
            color: #3AB09E;
            position: absolute;
        }
        .icons { 
            width: 80%; margin: 0 auto;
            -webkit-transition: -webkit-all 1s cubic-bezier(.87, -.41, .19, 1.44);
            transition: all 1s cubic-bezier(.87, -.41, .19, 1.44);
            overflow: hidden;
            height: auto;
            list-style: none;
            background-color: #ffffff;
            box-shadow: 1px 1px 1px 1px #DCDCDC;
            border-radius: 2em;
            -moz-user-select:none;
            -ms-user-select:none;
            user-select:none;
            }
        .icons li {
            position: relative;
            color: #3AB09E;
            width: 23%;
            display: inline-block;
            -webkit-user-select:none;
            }
        .hvr-overline-from-center {
            width: 60%;
            display: inline-block;
            vertical-align: middle;
            -webkit-transform: perspective(1px) translateZ(0);
            transform: perspective(1px) translateZ(0);
            box-shadow: 0 0 1px rgba(0, 0, 0, 0);
            position: relative;
            overflow: hidden;
        }
        .hvr-overline-from-center:before {
            content: "";
            position: absolute;
            z-index: -1;
            left: 51%;
            right: 51%;
            top: 0;
            background: #2098D1;
            height: 4px;
            -webkit-transition-property: left, right;
            transition-property: left, right;
            -webkit-transition-duration: 0.3s;
            transition-duration: 0.3s;
            -webkit-transition-timing-function: ease-out;
            transition-timing-function: ease-out;
        }
        .hvr-overline-from-center:hover {
            cursor: pointer;
        }
        .hvr-overline-from-center:hover:before, .hvr-overline-from-center:focus:before, .hvr-overline-from-center:active:before {
            left: 0;
            right: 0;
        }
        .weui-dialog__title {
            font-size: 15px;
        }
        .weui-dialog__bd {
            text-align: left;
            overflow: auto;
            min-height: 400px;
            max-height: 500px;
        }
        /* 设备网格一行显示5个 */
        .weui-grid {
            width: 20%;
            padding: 12px 2px;
        }
        .weui-grid__label {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 点击设备图标开关设备，点击其余空白区域编辑设备 */
        .weui-grid__icon {
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(0, 0, 0, .1);
        }
        .weui-grid__icon i {
            transition: transform .1s;
        }
        .weui-grid__icon:active i {
            transform: scale(.85);
        }
        /* 设备右键/长按操作菜单与信息面板 */
        #havcs-device-menu {
            position: fixed; z-index: 10000; display: none; min-width: 150px;
            padding: 6px 0; background: #fff; border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,.2); overflow: hidden;
        }
        #havcs-device-menu button {
            display: block; width: 100%; border: 0; background: transparent;
            padding: 13px 18px; text-align: left; color: #333; font-size: 14px;
        }
        #havcs-device-menu button:active { background: #f0f0f0; }
        #havcs-device-info {
            position: fixed; inset: 0; z-index: 10001; display: none;
            align-items: center; justify-content: center; padding: 18px;
            background: rgba(0,0,0,.45); box-sizing: border-box;
        }
        #havcs-device-info .havcs-info-card {
            width: min(560px, 100%); max-height: 82vh; overflow: auto;
            background: #fff; border-radius: 12px; padding: 18px;
            box-sizing: border-box; text-align: left;
        }
        #havcs-device-info h3 { margin: 0 0 14px; font-size: 18px; font-weight: 500; }
        #havcs-device-info .havcs-info-row { padding: 9px 0; border-bottom: 1px solid #eee; }
        #havcs-device-info .havcs-info-label { color: #888; font-size: 12px; margin-bottom: 4px; }
        #havcs-device-info .havcs-info-value {
            color: #333; font-size: 14px; white-space: pre-wrap;
            overflow-wrap: anywhere; font-family: inherit;
        }
        #havcs-device-info .havcs-info-actions {
            display: flex; gap: 10px; margin-top: 16px;
        }
        #havcs-device-info .havcs-info-actions button {
            flex: 1; border: 0; border-radius: 6px; padding: 11px;
            font-size: 14px; background: #eee; color: #333;
        }
        #havcs-device-info .havcs-info-actions .primary {
            background: #1aad19; color: #fff;
        }
        .weui-grid { -webkit-touch-callout: none; }

    </style>
</head>

<body ontouchstart class="page-bg">
<div id="app">

    <p>
    <!-- 使用 router-link 组件来导航. -->
    <!-- 通过传入 `to` 属性指定链接. -->

    <!-- <router-link to="/">设备列表</router-link>
    <router-link :to="{name:'edit',params:{device_id:1}}">设备信息</router-link> -->
    </p>
    <!-- 路由出口 -->
    <!-- 路由匹配到的组件将渲染在这里 -->
    <router-view :notice="notice" :device-list="deviceList" v-if="isRouterAlive"></router-view>
    <div class="blank"></div>

</div>

<template id="deviceListTemplate">
    <div>
    <div class="page-hd" >
        <h1 class="page-hd-title">
                {{ notice.title }}
        </h1>
        <div class="page-hd-desc">

        </div>
    </div>
    <div class="blank"></div>
    <div class="page-bd" >
        
        <div class="weui-cells__title">设备列表&nbsp;<span v-if="deviceList.length>0" class="weui-badge">{{ deviceList.length }}</span></div>
        <div class="weui-grids">
            <template v-for="(item, index) in deviceList">
            <a href="javascript:;" :key="item.device_id" :data-device-id="item.device_id" class="weui-grid js_grid" @click="addOrEdit(item.device_id)" >
                <div class="weui-grid__icon" onclick="event.stopPropagation();window.havcsTogglePower(this)" v-bind:data-entities="JSON.stringify(item.entity_id)" v-bind:data-power="item.power" :title="'on'==item.power?'点击关闭':'点击打开'">
                    <i class= "mdi mdi-48px" v-bind:class="item.icon" v-bind:style="{color: item.power == 'on' ? '#66ccff' : '#9a9a9a'}"></i>
                </div>
                <p class="weui-grid__label">{{ item.zone?item.name+"&nbsp（"+item.zone+"）" : item.name }}</p>
            </a>
            </template>

            <!-- <a href="javascript:;" class="weui-grid js_grid" @click="addOrEdit()" >
                <div class="weui-grid__icon">
                    <i class="icon icon-36" style="font-size: 50px;color: #03a9f4;"></i>
                </div>
                <p class="weui-grid__label">添加设备</p>
            </a> -->
        </div>
        <div class="blank"></div>
        <div id="wrapper">
            <div id="toolbar">
                <span class="toolbar__tip">tip text</span>
                <ul class="icons">
                    <li><div class="hvr-overline-from-center" tooltiptext="添加设备" @click="addOrEdit()"><i class="mdi mdi-36px mdi-view-grid-plus"></i></div></li>
                    <li><div class="hvr-overline-from-center" tooltiptext="导出设备" @click="exportDevices()"><i class="mdi mdi-36px mdi-download"></i></div></li>
                    <li><div class="hvr-overline-from-center" tooltiptext="导入设备" @click="importDevices()"><i class="mdi mdi-36px mdi-upload"></i></div></li>
                    <li><div class="hvr-overline-from-center" tooltiptext="同步设备" @click="syncDevices()"><i class="mdi mdi-36px mdi-sync"></i></div></li>
                    <!-- <li><div class="hvr-overline-from-center" tooltiptext="查看配置" @click="getConfig()"><i class="mdi mdi-36px mdi-text-box"></i></div></li>
                    <li><div class="hvr-overline-from-center" tooltiptext="参数设置" @click="EditSettings()"><i class="mdi mdi-36px mdi-cog-box"></i></div></li> -->
                </ul>
            </div>
        </div>
        <div id="settings" class="weui-popup__container popup-bottom">
            <div class="weui-popup__overlay"></div>
            <div class="weui-popup__modal">
                <div class="toolbar">
                    <div class="toolbar-inner">
                      <a href="javascript:;" class="picker-button close-popup">关闭</a>
                      <h1 class="title">标题</h1>
                    </div>
                  </div>
                  <div class="modal-content">
                    <div class="weui-cells weui-cells_form">
                        <div class="weui-cell">
                          <div class="weui-cell__hd"><label class="weui-label">qq</label></div>
                          <div class="weui-cell__bd">
                            <input class="weui-input" type="number" pattern="[0-9]*" placeholder="请输入qq号">
                          </div>
                        </div>
                </div>
            </div>
          </div>
        <form id="fileUploadForm" enctype="multipart/form-data">
            <input type="file" name="fileUpload" id="fileUpload" style="display:none" @change="upload(event)">
        </form>
    </div>
</div>
</template>
<template id="deviceEditTemplate">
    <div class="page-bd">
        <div class="weui-cells__title">填写下列信息</div>
        <div class="weui-cells weui-cells_form">
            <div class="weui-cell">
                <div class="weui-cell__hd"><label class="weui-label"><div class="required">device_id</div><div>（设备ID）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input class="weui-input" id="device_id" type="text" v-model="device.device_id" placeholder="选择实体和设备类型后自动生成，格式 havcs.xxx"/>
                    <div style="font-size:12px;color:#888;margin-top:5px">自动规则：havcs.{设备类型}_{实体ID后缀}；自动生成后仍可手动修改。</div>
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label class="weui-label"><div class="required">entity_id</div><div>（选择HA实体，可多选）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <select class="weui-select" v-model="entityDomainFilter" style="margin-bottom:8px">
                        <option value="all">全部实体类型</option>
                        <option v-for="domain in entityDomains" :key="domain" :value="domain">{{ domain }}</option>
                    </select>
                    <select id="entity_id" class="weui-select" multiple size="7" v-model="selectedEntityIds" @change="syncEntityIds" style="height:auto;min-height:150px;border:1px solid #ddd;padding:6px">
                        <option v-for="item in entityStates" :key="item.entity_id" :value="item.entity_id" v-if="entityDomainFilter === 'all' || item.entity_id.split('.')[0] === entityDomainFilter">{{ (item.attributes && item.attributes.friendly_name ? item.attributes.friendly_name + ' — ' : '') + item.entity_id }}</option>
                    </select>
                    <div style="font-size:12px;color:#888;margin-top:6px">列表来自 Home Assistant 当前已加载的实体；可按实体域过滤，支持多选。已选 {{ selectedEntityIds.length }} 个实体。</div>
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label class="weui-label"><div class="required">name</div><div>（设备名称）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input class="weui-input" id="name" type="text" v-model="device.name" placeholder="填写设备名称"/>
                </div>
            </div>
            <div class="weui-cell" style="display:none">
                <div class="weui-cell__hd"><label class="weui-label"><div>en_name</div><div>（设备名称）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input class="weui-input" id="en_name" type="text" v-model="device.en_name" placeholder="填写设备名称（echo音箱专用）"/>
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label for="" class="weui-label"><div>zone</div><div>（位置）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input id='zone' class="weui-input" type="text" v-model='device.zone' placeholder="填写设备位置"/>
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label class="weui-label"><div class="required">visable</div><div>（平台）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input id="visable" class="weui-input" type="text" v-model="device.visable" placeholder="选择音箱平台"/>
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label for="" class="weui-label"><div class="required">type</div><div>（设备类型）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input id='type' class="weui-input" type="text" v-model="device.type" placeholder="选择设备类型"/>
                </div>
                <div class="weui-cell__ft tooltip">
                    <label for="switchSyncFromType" class="weui-switch-cp">
                        <input id="switchSyncFromType" class="weui-switch-cp__input" type="checkbox" checked="checked">
                        <div class="weui-switch-cp__box "></div>
                    </label>
                    <span class="tooltiptext">同步设置图标</span>
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label class="weui-label"><div>icon</div><div>（图标）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input class="weui-input" id="icon" type="text" v-model="device.icon" placeholder="填写图标名称，样式见网站：http://cdn.materialdesignicons.com/5.0.45/"/>
                </div>
            </div>  
            <div class="weui-cell">
                <div class="weui-cell__hd"><label for="" class="weui-label"><div>attributes</div><div>（设备属性）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input id='attributes' class="weui-input" type="text" v-model="device.attributes" placeholder="自定义设备属性"/>                    
                </div>
            </div>
            <div class="weui-cell">
                <div class="weui-cell__hd"><label for="" class="weui-label"><div>actions</div><div>（控制指令）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input id='actions' class="weui-input" type="text" v-model="actionKeys" placeholder="自定义控制指令"/>
                </div>
            </div> 

        </div>
        <div v-if="showCustomAction" class="weui-cells__title">自定义actions（格式：['domain', 'service', 'service_data'], service_data要符合json格式，样例：['common_timer', 'cancel', '{"entity_id":"switch.demo"}']）</div>
        <multi-input v-for="(value, key) in device.actions" v-if="customAction.includes(key)" :key='key' :label='key' :data='value' @update-action="updateAction"></multi-input>
        <div class="blank"></div>
        <div class="weui-btn-area">
            <input type="button" href="javascript:;" class="weui-btn weui-btn_primary" @click="addOrUpdate(device.device_id)" :disabled="isAdd || isChange? false: 'disabled'" :class="isAdd || isChange? '': 'weui-btn_disabled'" :value="isAdd?'添 加':'更 新'"></input>
            <a href="javascript:;" v-if="isAdd == false" class="weui-btn weui-btn_warn" @click="delOrReturn(device.device_id)">删 除</a>
            <a href="javascript:;" class="weui-btn weui-btn_default" @click="delOrReturn(-1)">返 回</a>
        </div> 
    </div>
</template>
<template id="configTemplate">
    <div>
        <div class="blank"></div>
        <div class="page-hd" >
            <h1 class="page-hd-title">
                {{ config.title }}
            </h1>
        </div>
        <div class="blank"></div>
        <div class="page-bd" style="width:80%;margin: 0 auto;font-weight: 500;">
            <div v-html="config.content" v-highlight>
            </div>
        </div>
    </div>
</template>
<template id="settingsTemplate">
    <div>
        <div class="blank"></div>
        <div class="page-hd" >
            <h1 class="page-hd-title">
                参数设置
            </h1>
        </div>
        <div class="weui-cells weui-cells_form">
            <div class="weui-cell">
                <div class="weui-cell__hd"><label class="weui-label"><div class="required">filter</div><div>（过滤指令）</div></label></div>
                <div class="weui-cell__bd weui-cell_primary">
                    <input class="weui-input" id="command_filter" type="text" v-model="settings.command_filter" placeholder="过滤指令"/>
                </div>
            </div>
        </div>
        <div class="blank"></div>
        <div class="weui-btn-area">
            <a href="javascript:;" class="weui-btn weui-btn_primary" @click="updateSettings()">保 存</a>
            <a href="javascript:;" class="weui-btn weui-btn_default" @click="getSettings()">读 取</a>
        </div> 
    </div>
</template>
<template id="multi-input">
    <div class="weui-cells weui-cells_form">
        <base-input
            v-for="(item, index) in items"
            :key="item.id"
            :label="index === 0? label : ''"
            :default-value="{ id : item.id, value : item.value, isLastItem: index === items.length-1? true : false }"
            @change="(id, val) => inputChange(id, val, index)"
            @add-item="addItem"
            @delete-item="() => deleteItem(index)"
        />
    </div>
</template>
<template id="base-input">
    <div class="weui-cell">
        <div class="weui-cell__hd"><label class="weui-label"><div style="font-size: 0.8em;">{{label}}</div></label></div>
        <div class="weui-cell__bd weui-cell_primary">
            <input class="weui-input" type="text" @change="change($event)" :value="value" :class="isLastItem? '':'input_disabled'" :disabled="isLastItem? false: 'disabled'" placeholder=""/>
        </div>
        <div class="weui-cell__ft" style="margin-left: 10px;">
            <a v-if="isLastItem === false" class="icon icon-122" style="font-size: 20px;color: #f15d5d;" @click="deleteItem"></a>
            <a v-if="isLastItem === true" class="icon icon-36" style="font-size: 20px;color: #03a9f4;" @click="addItem($event)"></a>
        </div>
    </div>
</template>
<script>
// 新建设备的默认值修正：旧版main.min.js内置aligenie/dueros/jdwhale等多平台默认值且类型为空，
// 在组件创建前统一改为：平台仅dueros、类型默认switch开关（图标按类型联动，同"同步设置图标"勾选行为）
// （自包含，不依赖main.min.js构建版本；图标值对应const.py中DEVICE_TYPE_DICT['switch']['icon']）
(function() {
    if (!window.Vue) { return; }
    var fixDeviceDefaults = function(d) {
        if (!d || !d.device) { return d; }
        if (Array.isArray(d.device.visable)) {
            d.device.visable = ['dueros'];
        }
        if (!d.device.type) {
            d.device.type = 'switch';
        }
        if (!d.device.icon) {
            d.device.icon = 'mdi-toggle-switch';
        }
        return d;
    };
    var _extend = Vue.extend;
    Vue.extend = function(opts) {
        if (opts && opts.template === '#deviceEditTemplate') {
            if (typeof opts.data === 'function') {
                var origData = opts.data;
                opts.data = function() {
                    return fixDeviceDefaults(origData.apply(this, arguments));
                };
            } else if (opts.data) {
                fixDeviceDefaults(opts.data);
            }
            // weui选择器弹层挂在body上不随组件销毁：返回/保存离开页面时主动关闭，避免弹层残留。
            // 必须先按组件方式close每个select实例（复位_open标记），否则裸$.closePicker只关DOM不留回调，
            // 注册表里残留_open=true的脏实例，会导致再次进入页面后平台选择器永远打不开。
            var origBeforeDestroy = opts.beforeDestroy;
            opts.beforeDestroy = function() {
                if (window.jQuery) {
                    $(this.$el).find('input').each(function() {
                        var inst = $(this).data('weui-select');
                        if (inst) {
                            try { inst.close(); } catch (e) {}
                            inst._open = false;
                        }
                    });
                    if (typeof $.closePicker === 'function') {
                        try { $.closePicker(); } catch (e) {}
                    }
                }
                if (typeof origBeforeDestroy === 'function') {
                    origBeforeDestroy.call(this);
                } else if (Array.isArray(origBeforeDestroy)) {
                    for (var i = 0; i < origBeforeDestroy.length; i++) {
                        if (typeof origBeforeDestroy[i] === 'function') { origBeforeDestroy[i].call(this); }
                    }
                }
            };
        }
        return _extend.apply(Vue, arguments);
    };
})();
</script>
<script>
// ljr.im中转服务已停止：拦截发往ljr.im的所有vue-resource请求并返回空结果，
// 避免面板每次加载都触发DNS解析失败的报错（getNotice公告接口等）
(function() {
    if (!window.Vue || !Vue.http) { return; }
    var _post = Vue.http.post;
    if (typeof _post !== 'function') { return; }
    Vue.http.post = function(url) {
        if (typeof url === 'string' && url.indexOf('ljr.im') >= 0) {
            return Promise.resolve({ data: { code: '', data: null } });
        }
        return _post.apply(Vue.http, arguments);
    };
})();
</script>

<script>
// 定时刷新设备状态：仅重新拉取数据，Vue按设备ID复用节点局部更新，无闪烁
setInterval(function() {
    if (typeof vm !== 'undefined' && vm && typeof vm.getDevice === 'function') {
        vm.getDevice();
    }
}, 20000);

// 点击设备图标开关设备：调用HA原生服务（独立于main.min.js，任何构建可用）
window.havcsTogglePower = function(el) {
    var entities;
    try { entities = JSON.parse(el.dataset.entities || '[]'); } catch (e) { entities = []; }
    var controllable = ["switch", "light", "fan", "humidifier", "airpurifier", "media_player", "input_boolean", "cover", "vacuum", "climate", "script"];
    entities = entities.filter(function(e) { return controllable.indexOf(e.split(".")[0]) >= 0; });
    if (!entities.length) {
        if (window.jQuery) { $.toast("该设备没有可开关的实体", "forbidden"); }
        return;
    }
    var service = el.dataset.power == 'on' ? 'turn_off' : 'turn_on';
    var callSvc = function(domain, svc, data) {
        return ha.getAuthorization().then(function(auth) {
            return fetch('/api/services/' + domain + '/' + svc, {
                method: 'post',
                headers: { 'Authorization': auth, 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }).then(function(res) {
            if (!res.ok) { throw new Error('service call failed: ' + res.status); }
        });
    };
    Promise.all(entities.map(function(e) {
        return callSvc(e.split(".")[0], service, { entity_id: e });
    })).then(function() {
        if (window.jQuery) { $.toast(service == 'turn_on' ? "已发送：打开" : "已发送：关闭", "info"); }
        setTimeout(function() {
            if (typeof vm !== 'undefined' && vm && typeof vm.getDevice === 'function') { vm.getDevice(); }
        }, 800);
    }).catch(function(e) {
        if (window.jQuery) { $.toast("控制指令发送失败: " + (e && e.message ? e.message : ""), "error"); }
    });
};
</script>

<div id="havcs-device-menu" role="menu" aria-label="设备操作">
    <button type="button" data-havcs-action="view">查看设备信息</button>
    <button type="button" data-havcs-action="edit">修改设备</button>
</div>
<div id="havcs-device-info" role="dialog" aria-modal="true" aria-label="设备信息">
    <div class="havcs-info-card">
        <h3 id="havcs-device-info-title">设备信息</h3>
        <div id="havcs-device-info-content"></div>
        <div class="havcs-info-actions">
            <button type="button" data-havcs-info-action="close">关闭</button>
            <button type="button" class="primary" data-havcs-info-action="edit">修改设备</button>
        </div>
    </div>
</div>
<script>
// 设备卡片上下文操作：桌面端右键，触屏端长按；普通点击仍保持原有编辑行为。
(function () {
    var menu = document.getElementById('havcs-device-menu');
    var infoDialog = document.getElementById('havcs-device-info');
    var infoTitle = document.getElementById('havcs-device-info-title');
    var infoContent = document.getElementById('havcs-device-info-content');
    var activeDeviceId = null;
    var infoDeviceId = null;
    var holdTimer = null;
    var startPoint = null;
    var longPressTriggered = false;
    var suppressCardClick = false;
    var labels = {
        device_id: '设备 ID', name: '设备名称', en_name: '英文名称',
        entity_id: '关联 HA 实体', zone: '设备位置', visable: '可见平台',
        type: '设备类型', icon: '图标', attributes: '设备属性',
        actions: '控制指令', properties: '设备属性映射', power: '当前状态'
    };

    function findCard(target) {
        return target && target.closest ? target.closest('.weui-grid[data-device-id]') : null;
    }
    function getDevice(id) {
        if (!window.vm || !Array.isArray(window.vm.deviceList)) return null;
        return window.vm.deviceList.find(function (item) { return String(item.device_id) === String(id); }) || null;
    }
    function closeMenu() {
        menu.style.display = 'none';
        activeDeviceId = null;
    }
    function openMenu(card, x, y) {
        var deviceId = card.getAttribute('data-device-id');
        if (!getDevice(deviceId)) return;
        activeDeviceId = deviceId;
        menu.style.display = 'block';
        var width = menu.offsetWidth || 160;
        var height = menu.offsetHeight || 96;
        menu.style.left = Math.max(8, Math.min(x, window.innerWidth - width - 8)) + 'px';
        menu.style.top = Math.max(8, Math.min(y, window.innerHeight - height - 8)) + 'px';
    }
    function showDeviceInfo() {
        infoDeviceId = activeDeviceId;
        var device = getDevice(infoDeviceId);
        if (!device) return;
        infoTitle.textContent = device.name || device.device_id || '设备信息';
        infoContent.textContent = '';
        Object.keys(labels).forEach(function (key) {
            if (!Object.prototype.hasOwnProperty.call(device, key)) return;
            var row = document.createElement('div');
            row.className = 'havcs-info-row';
            var label = document.createElement('div');
            label.className = 'havcs-info-label';
            label.textContent = labels[key];
            var value = document.createElement('div');
            value.className = 'havcs-info-value';
            var raw = device[key];
            value.textContent = raw !== null && typeof raw === 'object'
                ? JSON.stringify(raw, null, 2)
                : String(raw === null || typeof raw === 'undefined' ? '' : raw);
            row.appendChild(label);
            row.appendChild(value);
            infoContent.appendChild(row);
        });
        infoDialog.style.display = 'flex';
        closeMenu();
    }
    function editDevice(fromInfo) {
        var id = fromInfo ? infoDeviceId : activeDeviceId;
        if (!id || !window.vm || !window.vm.$router) return;
        closeMenu();
        infoDialog.style.display = 'none';
        window.vm.$router.push({ name: 'device:edit', params: { device_id: id } });
        activeDeviceId = null;
        infoDeviceId = null;
    }
    function cancelHold() {
        if (holdTimer) window.clearTimeout(holdTimer);
        holdTimer = null;
    }

    document.addEventListener('contextmenu', function (event) {
        var card = findCard(event.target);
        if (!card) return;
        event.preventDefault();
        event.stopPropagation();
        openMenu(card, event.clientX, event.clientY);
    }, true);

    document.addEventListener('touchstart', function (event) {
        var card = findCard(event.target);
        if (!card || !event.touches || event.touches.length !== 1) return;
        cancelHold();
        longPressTriggered = false;
        startPoint = { x: event.touches[0].clientX, y: event.touches[0].clientY };
        holdTimer = window.setTimeout(function () {
            longPressTriggered = true;
            suppressCardClick = true;
            openMenu(card, startPoint.x, startPoint.y);
        }, 550);
    }, { capture: true, passive: true });

    document.addEventListener('touchmove', function (event) {
        if (!holdTimer || !startPoint || !event.touches || !event.touches.length) return;
        var dx = event.touches[0].clientX - startPoint.x;
        var dy = event.touches[0].clientY - startPoint.y;
        if (Math.sqrt(dx * dx + dy * dy) > 12) cancelHold();
    }, { capture: true, passive: true });

    document.addEventListener('touchend', function () {
        cancelHold();
        if (longPressTriggered) {
            window.setTimeout(function () { suppressCardClick = false; }, 800);
        }
        startPoint = null;
    }, true);
    document.addEventListener('touchcancel', cancelHold, true);

    document.addEventListener('click', function (event) {
        if (suppressCardClick && findCard(event.target)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            suppressCardClick = false;
            return;
        }
        if (menu.contains(event.target)) {
            var action = event.target.getAttribute('data-havcs-action');
            if (action === 'view') showDeviceInfo();
            if (action === 'edit') editDevice();
            return;
        }
        if (infoDialog.contains(event.target)) {
            var infoAction = event.target.getAttribute('data-havcs-info-action');
            if (infoAction === 'close' || event.target === infoDialog) {
                infoDialog.style.display = 'none';
            } else if (infoAction === 'edit') {
                editDevice(true);
            }
            return;
        }
        if (menu.style.display === 'block') closeMenu();
    }, true);

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            closeMenu();
            infoDialog.style.display = 'none';
        }
    });
    window.addEventListener('resize', closeMenu);
    window.addEventListener('scroll', closeMenu, true);
})();
</script>
